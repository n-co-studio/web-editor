# Operator Automation Layer — default configuration.
# Schema: .claude/.automation/schemas/runner-config.yaml
#
# Runtime toggles (e.g., enabled: true) should be set in config.local.yaml,
# which is gitignored and survives git checkout. This file is git-tracked;
# local runtime overrides belong in config.local.yaml to avoid accidental
# commits. config.local.yaml fields take priority over this file.

runner:
  enabled: false
  default_auto_mode: false
  default_solo_mode: false
  default_push_on_complete: false
  max_retries: 3
  heartbeat_interval: 30
  stderr_tail_lines: 50
  cohesion_trigger: 0
  auto_remediation: false
  auto_remediation_severity: CRITICAL
  poll_interval: 60
  cooldown_between_sessions: 5
  max_consecutive_sessions: 0
  max_deferral_cycles: 3
  session_max_ttl_seconds: 21600  # Per-session elapsed-time cap (6 hours). 0 = disabled.

# Model routing — controls the --model flag passed to claude -p in runner.sh.
# Agent frontmatter controls per-subagent model (cost layer 1: subagent routing).
# model_routing_overrides controls the orchestrator process model (cost layer 2: session routing).
# Precedence: model_routing_overrides[session_type] → model_routing.default.
# NOTE: model_routing_overrides is a top-level block (not nested) because
# _parse_config_field requires top-level keys for its sed range pattern.
model_routing:
  default: sonnet

model_routing_overrides:
  audit: haiku
  queue-triage: haiku
  standard: sonnet
  taskgroup-merge: sonnet
  # Evaluation study session types (Decision t-0046 Amendment 1)
  eval: sonnet        # Conductor — orchestrates arms×tasks×reps; sonnet for reasoning quality
  eval-cell: sonnet   # Per-cell agent run — task execution in isolated worktree
  judge: haiku        # Read-only scoring; haiku sufficient for rubric application

retention:
  queue_days: 30
  report_days: 90
  escalation_days: 90
  review_log_days: 90
