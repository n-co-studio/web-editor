# Operator Automation Layer — default configuration.
# Schema: .claude/.automation/schemas/runner-config.yaml
# Set enabled: true to activate headless runner infrastructure.

runner:
  enabled: false
  default_auto_mode: false
  default_solo_mode: false
  default_push_on_complete: false
  max_retries: 3
  heartbeat_interval: 30
  stderr_tail_lines: 50
  cohesion_trigger: 100
  poll_interval: 60
  cooldown_between_sessions: 5
  max_consecutive_sessions: 0

retention:
  queue_days: 30
  report_days: 90
  escalation_days: 90
  review_log_days: 90
