# Review Log Entry Schema — shape of a single NDJSON line in review-log files.
# Each daily file (review-log-YYYY-MM-DD.jsonl) contains one JSON object per line.

review_log_entry:
  seq: 0                    # monotonic sequence number within daily file
  timestamp: ""             # ISO 8601 timestamp
  # Event names actually emitted, reconciled against every `review_log_append`
  # call site on 2026-10-23 (t-0057 brief 3) with a diff of
  # `grep -rhoE 'review_log_append "[a-z-]+"' .claude | sort -u` against this
  # line. The 2026-10-21 pass fixed six names and the list promptly drifted
  # TWELVE more behind — every operator command t-0055 added emits one, and
  # none were listed. Nothing validates this enum mechanically, so it drifts
  # silently and a reader has no way to tell a stale list from a complete one.
  # Add the name here in the same commit as any new call site, and reconcile
  # with the diff above rather than by eye: the 2026-10-21 pass miscounted.
  event: ""                 # entry-started | entry-completed | entry-escalated | entry-failed | entry-deferred | entry-blocked | entry-recovered | entry-reopened | entry-reopen-reason | entry-stop-requested | entry-stopped | entry-resumed | entry-discarded | entry-note-sent | entry-notes-delivered | entry-parent-context | entry-follow-up-created | entry-close-path-set | entry-merge-requested | entry-conflict-resolved | entry-conflict-resolve-reason | transition-failed | work-order-opened | work-order-completed | work-order-escalated | work-order-failed | work-order-reopened | work-order-reconciled | group-worktree-reset
  work_order_id: ""         # parent work order identifier
  entry_id: ""              # queue entry identifier (absent for work-order-level events)
  summary: ""               # human-readable event description
  detail: {}                # event-specific context (JSON object)
