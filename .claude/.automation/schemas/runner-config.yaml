# Runner Config Schema — operational configuration for automation runners.
# config.yaml in the parent directory follows this schema.

runner:
  enabled: false            # master toggle — runners must not execute when false
  default_auto_mode: false  # default auto_mode for new queue entries
  default_solo_mode: false  # default solo_mode for new queue entries
  default_push_on_complete: false  # default push_on_complete for new queue entries
  max_retries: 3            # default max retries per queue entry
  heartbeat_interval: 30    # seconds between runner heartbeat checks
  stderr_tail_lines: 50     # lines of stderr to capture in blocker reports
  cohesion_trigger: 0       # line-change threshold triggering cohesion review (0 = disabled)
  poll_interval: 60                # Daemon idle poll interval in seconds (default: 60)
  cooldown_between_sessions: 5     # Pause between sessions in seconds (default: 5)
  max_consecutive_sessions: 0      # Max sessions before daemon exits; 0 = unlimited
  max_deferral_cycles: 3           # Max work-order deferral cycles before entry transitions to blocked
  session_max_ttl_seconds: 21600   # Per-session elapsed-time cap in seconds (6h default). 0 = disabled.

model_routing:
  default: sonnet            # model for claude -p when no model_routing_overrides match (sonnet | haiku)

model_routing_overrides:     # per-session-type model override map (keys: Decision 0014 session types)
  # <session_type>: <model>  e.g., audit: haiku
  # Must be top-level block — _parse_config_field requires column-0 keys

retention:
  queue_days: 30            # days to retain completed queue entries
  report_days: 90           # days to retain blocker reports
  escalation_days: 90       # days to retain resolved escalations
  review_log_days: 90       # days to retain review-log NDJSON files
