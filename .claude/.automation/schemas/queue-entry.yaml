# Queue Entry Schema — defines a single automation task in the queue.
# State machine: pending-review → approved → running → completed/failed/review/blocked

entry:
  id: ""                    # unique entry identifier (UUID or timestamp-based)
  status: pending-review    # pending-review | approved | running | completed | failed | review | blocked
  priority: 0               # lower = higher priority; 0 = default
  session_type: ""          # Decision 0014 enum (18 types, not extended)
  branch: ""                # target branch name
  brief_path: ""            # path to task brief (if applicable)
  prompt: ""                # assembled prompt for claude -p (written at dequeue, not creation)
  last_prompt: ""           # preserved prompt from previous attempt (diagnostic — written on retry/failure)
  auto_mode: false          # true = skip op-review phase
  solo_mode: false          # true = merge to main at close (Decision 0015)
  retry_count: 0            # number of retry attempts so far
  max_retries: 3            # maximum retries before marking blocked
  error_log: ""             # path to blocker-report on failure
  work_order_id: ""         # (v1.1.0) parent work order ID (optional)
  push_on_complete: false   # true = push branch to origin after session completes (opt-in)
  scope_classification: ""  # briefed | unbriefed-in-scope | out-of-scope (schema contract — populated by runner/queue-manager implementations at commit time when scope deviates)
  project: ""               # (v1.4.0) free-text project name; overrides work order value (optional, standalone entries)
  milestone:                # (v1.4.0) milestone override; entry wins over work order (optional)
    name: ""                # milestone label
    index: 0                # 1-based milestone position
    total: 0                # total milestones in project
  created_at: ""            # ISO 8601 timestamp
  updated_at: ""            # ISO 8601 timestamp
  completed_at: ""          # ISO 8601 timestamp (set on terminal state)
  permission_profile: build # build | judge | ... (Decision t-0046 Amendment 1)
  model: ""                 # optional per-entry model pin (Decision t-0046 Amendment 3)
                             # used verbatim by the runner — bypasses _resolve_model_for_session
                             # so a later alias-map change cannot silently rewrite study history
