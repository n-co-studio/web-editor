session_decisions:
  - session: 1
    decision: "Bundle shared into mcp-server via tsup noExternal rather than publishing as 3rd package"
    rationale: "Pre-release, operator decision — avoids lockstep versioning; users never use shared directly"
  - session: 1
    decision: "Clean rename with no back-compat shims"
    rationale: "Zero existing users — pre-release; shims add dead code"
  - session: 4
    decision: "Replace Repo OS generic issue templates with product-specific NCO Studio templates"
    rationale: "The .github/ISSUE_TEMPLATE/ files were Repo OS governance templates; brief scope explicitly lists these as product files to create for user-facing support"
  - session: 4
    decision: "Demo app uses workspace star resolution (*) for web-editor-plugin version"
    rationale: "Pre-publish: plugin is a workspace package; * resolves to the local workspace version so post-publish Brief 5 can replace with a real published version"
  - session: 5
    decision: "publish-dry-run.mjs uses --ignore-scripts to skip prepublishOnly during dry-run"
    rationale: "prepublishOnly rebuilds via tsup which can fail due to tsconfig issues (pre-existing in dev-plugin); the dry-run verifies tarball structure against already-built dist/, not against a fresh rebuild"
  - session: 5
    decision: "CHANGELOG version header corrected from [1.0.0] to [0.1.0]"
    rationale: "Cross-session fix — packages are at 0.1.0 (pre-release); the initial changelog entry from Brief 2 used 1.0.0 incorrectly"

