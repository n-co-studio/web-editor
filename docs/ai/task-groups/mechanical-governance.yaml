conventions:
  naming:
    - pattern: "state-guard, state-writer, plan-approval (kebab-case for hook scripts)"
      scope: ".claude/hooks/"
    - pattern: "plan-approved, cohesion-reviewed, qa-verified, reviewer-signed, security-signed, high-risk-detected (kebab-case for state files)"
      scope: ".claude/.state/"
    - pattern: "GATE_RESULT: APPROVED | BLOCKED reason=\"...\" (uppercase sentinel prefix)"
      scope: "Agent output final line"
    - pattern: "REPO_OS_ prefix for override env vars"
      scope: "Hook scripts"
  patterns:
    - pattern: "Hook scripts source _analytics-helper.sh and log via log_hook_event"
      rationale: "Consistent with all existing hooks (Decision 0004, 0009)"
    - pattern: "PreToolUse guard hooks read stdin JSON, extract tool_input via jq, exit 2 to block"
      rationale: "Matches agent-git-guard.sh and branch-guard.sh patterns"
    - pattern: "State files written by shell I/O only (echo/printf > file), never Write tool"
      rationale: "Prevents circular dependency — state-guard blocks model writes, state-writer uses shell I/O"
    - pattern: "State file format: multi-line key-value. Verdict files: timestamp/agent/GATE_RESULT. plan-approved: timestamp/question_hash/large-scope"
      rationale: "Grep-friendly, human-readable audit evidence. plan-approved diverges from verdict format (no agent/GATE_RESULT) because it captures operator intent, not agent verdict"
  decisions:
    - "0003"
    - "0004"
  boundaries:
    - module: ".claude/.state/"
      owner_brief: "State Machine Foundation"
    - module: ".claude/hooks/state-guard.sh"
      owner_brief: "State Machine Foundation"
    - module: ".claude/hooks/state-writer.sh"
      owner_brief: "State Machine Foundation"
    - module: ".claude/hooks/plan-approval.sh"
      owner_brief: "Plan Approval Gate"
    - module: ".claude/hooks/branch-guard.sh (plan-approved phase gate)"
      owner_brief: "Plan Approval Gate"
    - module: ".claude/hooks/pre-commit-gates.sh (state verification, high-risk, A1 parser)"
      owner_brief: "Commit and Push Gate Upgrades"
    - module: ".claude/hooks/pre-push-gates.sh (blocking B1/B2/B3)"
      owner_brief: "Commit and Push Gate Upgrades"
    - module: "docs/ai/decisions/**/## Triggers sections"
      owner_brief: "A1 Decision Triggers"
    - module: "docs/ai/governance/"
      owner_brief: "Inter-Session and Phase Chain Governance"
    - module: ".claude/hooks/session-close-check.sh (state cleanup, override audit, governance evidence)"
      owner_brief: "Inter-Session and Phase Chain Governance"
    - module: ".claude/hooks/_analytics-helper.sh (log_override function)"
      owner_brief: "Inter-Session and Phase Chain Governance"
    - module: ".claude/hooks/branch-guard.sh (Gates 3-4: inter-session + phase chain)"
      owner_brief: "Inter-Session and Phase Chain Governance"

integration_points:
  - name: "State file format"
    producer: "State Machine Foundation"
    consumer: "Commit and Push Gate Upgrades"
    artifact: ".claude/.state/* (timestamp/agent/GATE_RESULT)"
  - name: "plan-approved state file"
    producer: "Plan Approval Gate"
    consumer: "Commit and Push Gate Upgrades"
    artifact: ".claude/.state/plan-approved (with large-scope flag)"
  - name: "State directory path"
    producer: "State Machine Foundation"
    consumer: "Inter-Session and Phase Chain Governance"
    artifact: ".claude/.state/"
  - name: "GATE_RESULT sentinel protocol"
    producer: "State Machine Foundation"
    consumer: "A1 Decision Triggers"
    artifact: "Agent definitions (critic.md, qa-verifier.md, reviewer.md, security-privacy.md)"
  - name: "A1 trigger parser (blocking mode)"
    producer: "Commit and Push Gate Upgrades"
    consumer: "A1 Decision Triggers"
    artifact: ".claude/hooks/pre-commit-gates.sh + docs/ai/decisions/.a1-triggers-enforced sentinel"
  - name: "Task group contract governance section"
    producer: "Inter-Session and Phase Chain Governance"
    consumer: "Inter-Session and Phase Chain Governance"
    artifact: "docs/ai/task-groups/_contract-template.yaml (governance: block)"
  - name: "Override audit log"
    producer: "Inter-Session and Phase Chain Governance"
    consumer: "Inter-Session and Phase Chain Governance"
    artifact: ".claude/.state/overrides.log (session-scoped, append-only)"

session_decisions:
  - session: 1
    decision: "Pre-commit state verification must account for Orchestrator override of BLOCKED verdicts"
    rationale: "The Critic may emit GATE_RESULT: BLOCKED with recommendations that the Orchestrator triages as non-issues (operator-accepted). The raw state file captures the Critic's verdict, not the Orchestrator's triage. Brief 3 (Commit and Push Gate Upgrades) needs an override mechanism — e.g. the Orchestrator writes an override marker or the pre-commit hook accepts operator confirmation — so that operator-accepted cohesion findings don't block commits."
  - session: 2
    decision: "Plan-approval hook bootstrapping requires manual state file creation in first session"
    rationale: "The plan-approval hook writes .claude/.state/plan-approved, and branch-guard checks for it. But the hook can't fire until wired in settings.json, and settings.json can't be edited until plan-approved exists. First session deploying these hooks requires operator to manually create the bootstrap state file or use REPO_OS_SKIP_PLAN_GATE=1. Subsequent sessions work normally because the hook fires on AskUserQuestion before any edits."
  - session: 3
    decision: "State file existence-only check resolves Orchestrator override of BLOCKED verdicts"
    rationale: "Pre-commit hook checks whether state files exist, not whether they contain GATE_RESULT: APPROVED. This naturally handles session 1's concern — if the agent ran (state file exists) and the Orchestrator proceeded to commit, the operator accepted the findings. Avoids a second override-marker layer."
  - session: 4
    decision: "Keyword parser must preserve internal spaces for multi-word keywords"
    rationale: "Brief 3's keyword pattern builder used tr/sed that stripped ALL whitespace, breaking multi-word keywords like 'prompt system'. Fixed to only replace comma delimiters with pipe alternation, preserving spaces within keyword phrases."
  - session: 4
    decision: "plan-approval.sh PostToolUse hook fails to capture AskUserQuestion answer — tool_output field empty or structured differently than expected"
    rationale: "Analytics show hook reaches Gate 3 (affirmative answer check) but logs not_approved despite user selecting 'Yes'. The jq extraction of .tool_output from the PostToolUse payload likely returns empty for AskUserQuestion — the answer may be in a different field (.tool_result, .response, or nested in .tool_input.answers). Brief 5 should investigate the actual PostToolUse payload structure and fix the extraction. Workaround: bootstrap state file or REPO_OS_SKIP_PLAN_GATE=1."
  - session: 5
    decision: "Governance evidence is model-written (not hook-written) to avoid circular dependencies at session close"
    rationale: "The session-close hook runs at Stop time. Writing to committed YAML files and committing from within the hook creates a circular dependency (commit triggers pre-commit gates which check state files being simultaneously cleaned). The model writes governance evidence as part of normal session-close contract updates; hooks verify it was written (advisory only)."

