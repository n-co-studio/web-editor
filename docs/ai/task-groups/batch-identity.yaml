session_decisions:
  - session: "eadaa5a1-a812-4537-8ca9-f5b61ea51d3e"
    decision: "batchId format chosen: batch-YYYYMMDD-HHMMSS-xxxx (human-readable, date+time+4-char hex)"
    rationale: "Operator communicates batch references to agent and reads the id in the panel; readable date-time id serves both. UUID was the lighter alternative but rejected for readability."
  - session: "eadaa5a1-a812-4537-8ca9-f5b61ea51d3e"
    decision: ">100 diffs handling: loop-send all diffs under one batchId (multiple WS messages, same batchId)"
    rationale: "Keeps one-click-one-batchId invariant pure; avoids silent split with no signal. Alternative (cap+surface feedback with second click as new batchId) was rejected to keep logical batch cohesion."
  - session: "eadaa5a1-a812-4537-8ca9-f5b61ea51d3e"
    decision: "batchId is additive-optional on VisualDiff; no WS_PROTOCOL_VERSION bump (stays 0.4.0)"
    rationale: "Consistent with uid/stylesheetChanges/scriptChanges precedent (data-contracts.md:146,302). Pre-batchId consumers degrade gracefully to flat-pool processing."
  - session: "eadaa5a1-a812-4537-8ca9-f5b61ea51d3e"
    decision: "MCP get_pending_visual_changes returns flat changes + notes + batches index (not nested diffs under batches)"
    rationale: "Nested diffs harms agent parsing and breaks flat-list consumers. Flat changes + lightweight batches index balances agent convenience with backward compatibility."
  - session: "eadaa5a1-a812-4537-8ca9-f5b61ea51d3e"
    decision: "notes array preserved in get_pending_visual_changes return; gains batchId correlation"
    rationale: "Removing notes would break existing agent consumers. Each note gains optional batchId so the previously decoupled batch note re-associates with its batch."

