intent:
  goal: >
    Ratify a stable per-dispatch batch identity contract in the compiled specs
    so Brief 2 implements against an agreed schema. batchId is minted at
    Apply-Changes click time, carried through VisualDiff → WebSocket → bridge →
    pending-queue → MCP tool output, enabling agents to group changes by batch
    and reason about stale batches.
  verification:
    - "data-contracts.md VisualDiff table has additive-optional batchId row with no-protocol-bump note"
    - "data-contracts.md documents VISUAL_DIFF_BATCH { diffs, batchNote?, batchId? } envelope"
    - "data-contracts.md documents get_pending_visual_changes { changes, notes, batches } + batchId filter"
    - "data-contracts.md documents get_queue_status.latest_batch_id"
    - "data-contracts.md documents PendingNote.batchId and legacy-degradation rules"
    - "feature-004 defines batchId generation (extension, click-time, readable, retry-stable, one-click-one-id)"
    - "feature-004 specifies batch grouping in persistent Sent/Applied panel sections"
    - "feature-004 defines >100-diff invariant (loop-send one batchId) and corrects Sent: queue cleared text"
    - "feature-004 adds Future Considerations hook for deferred batch-lifecycle tools"
    - "feature-005 reflects bridge batchId preservation, batches summary, latest_batch_id, batchId filter"
    - "governance evidence updated"
    - "No product code files changed"
  scope_files:
    - "docs/spec/compiled/v1/features/feature-004-change-batching.md"
    - "docs/spec/compiled/v1/data-contracts.md"
    - "docs/spec/compiled/v1/features/feature-005-mcp-server-bridge.md"
    - "docs/ai/governance/spec-compiled.yaml"
  spec_references:
    - "docs/spec/compiled/v1/features/feature-004-change-batching.md"
    - "docs/spec/compiled/v1/data-contracts.md"
    - "docs/spec/compiled/v1/features/feature-005-mcp-server-bridge.md"

conventions:
  naming:
    - pattern: "batchId format: batch-YYYYMMDD-HHMMSS-xxxx (date + time + 4-char random hex suffix)"
      scope: "batchId generation in extension, wire format, spec, and UI display"
    - pattern: "batches summary index: [{ batchId, batchNote?, createdAt, diffCount }]"
      scope: "get_pending_visual_changes MCP tool return shape batches field"
  patterns:
    - pattern: "additive-optional — no WS_PROTOCOL_VERSION bump for batchId (same rule as uid/stylesheetChanges/scriptChanges)"
      rationale: "Pre-batchId consumers ignore unknown fields and degrade to flat-pool processing (data-contracts.md:146,302 precedent)"
    - pattern: "one Apply-Changes click = one batchId; loop-send if >100 diffs (multiple WS messages, same batchId)"
      rationale: "Keeps the logical batch identity pure across large dispatches"
    - pattern: "legacy pending-queue.json without batchId = ungrouped 'legacy' batch; no migration code"
      rationale: "Strictly additive; existing queues remain processable"
  decisions:
    - "Decision 0014"
    - "Decision 0020"
    - "Decision 0038"
  boundaries:
    - module: "compiled spec (feature-004, data-contracts, feature-005, governance)"
      owner_brief: "Ratify Batch Identity & Grouping Contract (spec + governance)"
    - module: "implementation (shared types, protocol, batching, mcp-server)"
      owner_brief: "Implement Batch Identity (batchId stamp + bridge + panel grouping)"

