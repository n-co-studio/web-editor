intent:
  goal: >
    Resolve image src/background-image to a public served path (/images/<name>),
    never inline base64 into diffs, and strip the leading /public everywhere the
    path is emitted. Foundation for Brief 2 (#29). Fixes issue #28.
  verification:
    - "A file-picker-added image produces an AttributeChange whose toValue is a /images/<name> path (no data: URI, no /public prefix), with pendingUpload metadata carried to the server."
    - "Duplicating an element whose src is a newly-added image yields an InsertChange.outerHTML containing NO data: URI."
    - "A background-image picked via the media panel is referenced as url(/images/<name>), not url(data:...)."
    - "bridge saveDataUrl returns a path with no leading /public segment."
    - "An oversized asset yields assetTruncated: true and an empty toValue rather than an inline multi-MB blob."
    - "tsc --noEmit passes; npm run build produces dist; existing bridge/serializer tests pass."
  scope_files:
    - "packages/chrome-extension/src/content/editing/media.ts"
    - "packages/chrome-extension/src/shared/dom-utils.ts"
    - "packages/mcp-server/src/bridge.ts"
    - "packages/mcp-server/src/server.ts"
    - "packages/shared/src/diff.ts"
    - "docs/spec/compiled/v1/data-contracts.md"
  spec_references:
