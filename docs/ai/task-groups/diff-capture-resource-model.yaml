session_decisions:
  - session: "235f9a0a-cd57-4318-a405-248da81eca41"
    decision: "Capture emits a provisional /images/<filename> path (not a data: or blob: URI) as AttributeChange.toValue; the blob URL is used only for live DOM preview. The bridge is the resolution point (dedup / persist / size-cap)."
    rationale: "Guarantees toValue is already base64-free and apply-shaped even if the server does nothing; the content script has no filesystem access so it cannot hash/persist. Satisfies verification criterion 1 by construction."
  - session: "235f9a0a-cd57-4318-a405-248da81eca41"
    decision: "Per-asset size cap set at 4 MB (MAX_INLINE_ASSET_BYTES). Dedup to a committed file wins regardless of size; the cap only bites when writing a NEW oversized inline asset that cannot be deduplicated -> assetTruncated."
    rationale: "Bounds diff payload without nuking legitimately committed assets; an asset >4MB that is not in the repo should be committed directly, not pasted through a diff."
  - session: "235f9a0a-cd57-4318-a405-248da81eca41"
    decision: "blob: URL surviving into InsertChange.outerHTML (duplicate-after-pick, pre-apply) is a documented partial for Brief 1; closed by Brief 2 (#29) resolved assetPath on element references. Documented in bridge.ts + data-contracts."
    rationale: "Resolving a blob: in outerHTML needs pendingUpload correlation on InsertChange, which is Brief 2 scope. Critic recommendation #5 addressed by documentation, not silent passthrough."
  - session: "235f9a0a-cd57-4318-a405-248da81eca41"
    decision: "Brief 2: new element->ref resolver named resolveElementAssetRef(el: Element), NOT the approved key-interface name resolveElementAsset(el) — that name is Brief 1's File-taking media-picker helper. Both fields (assetPath + label) are both-or-neither, emitted ONLY when an asset resolves (spread of {} for non-image carriers), and never a data:/blob: value."
    rationale: "Faithful execution of the approved design; only the identifier changed to avoid a same-file overload TypeScript cannot express for module functions. Pragmatist's no-dead-field constraint met by the {}-spread pattern."
  - session: "235f9a0a-cd57-4318-a405-248da81eca41"
    decision: "insert-source.ts (anchorFromElement + collectChildSnapshot) enriched with resolveElementAssetRef even though it is not in Brief 2's literal scope_files — it is the SOLE construction site for insert SiblingAnchor / ChildSnapshotEntry, both explicitly named in the contract goal. In-goal, minimal (8 lines via the shared helper). Critic + QA confirmed sound."
    rationale: "The contract goal ('insert sibling anchors and child snapshots') cannot be met without touching the file that builds those shapes; scattering the enrichment across index.ts callers would be worse."
  - session: "235f9a0a-cd57-4318-a405-248da81eca41"
    decision: "drift_check returned code 4 (spec-snapshot mismatch) for data-contracts.md — Brief 1's merged edit (8ba5b51) moved the file after Brief 2 was planned. Operator accepted focused re-approval; plan-approved + pragmatist-signed seated from the sealed bundle (mode: auto)."
    rationale: "Expected dependency drift — the brief explicitly shares data-contracts.md with Brief 1. Other two snapshotted specs matched."

