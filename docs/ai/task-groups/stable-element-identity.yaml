    - "docs/spec/compiled/v1/features/feature-001-element-selection.md"

# Shared conventions — REQUIRE-level constraints for all sessions in the group.
conventions:
  naming:
    - pattern: "data-fe-uid — DOM attribute carrying the stable per-instance uid"
      scope: "stamped elements across dev-plugin (build-time) + content script (runtime)"
    - pattern: "uid — ElementInfo / SiblingAnchor / ChildSnapshotEntry field name for the same value"
      scope: "packages/shared/src/diff.ts diff payload schema"
    - pattern: "anchorUid + anchorPosition (before|after) — source-anchored insert addressing"
      scope: "InsertChange in the diff payload + applier"
  patterns:
    - pattern: "uid is the canonical diff-targeting key; data-source-* are code-map hints only, never identity"
      rationale: "Clones inherit the origin's data-source-line — identity must be per-instance (issue #27)."
    - pattern: "Additive-optional schema fields; no WS_PROTOCOL_VERSION bump"
      rationale: "Pre-uid consumers ignore unknown fields and degrade to selector targeting (same treatment as reorder/insert/reparent)."
  decisions:
    - "Decision 0035 — selective spec loading via Spec References"
    - "Decision 0018 — task group contract A6 gates"
  boundaries:
    - module: "compiled-spec/data-contracts"
      owner_brief: "Ratify the identity contract"
    - module: "compiled-spec/features"
      owner_brief: "Ratify the identity contract"
    - module: "product-code (dev-plugin, content-script, shared-diff, mcp-server apply)"
      owner_brief: "Implement stable element identity (applier + runtime)"

# Integration points — cross-brief touchpoints. Brief 1 produces the ratified
