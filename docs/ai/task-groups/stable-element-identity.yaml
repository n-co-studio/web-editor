# Intent — per-brief task contract fields (Decision 0020). Brief 1's intent.
intent:
  goal: >-
    Ratify the stable per-instance element-identity contract (data-fe-uid) in the
    compiled specs before implementation, so the downstream applier and the build
    session work against an agreed schema. No product code.
  verification:
    - "data-contracts.md defines uid on ElementInfo, SiblingAnchor, ChildSnapshotEntry and a normative InsertChange anchor table."
    - "data-contracts.md contains a uid->source mapping section covering existing/clone/fresh-insert cases."
    - "data-contracts.md documents the stamping lifecycle and deployment-aware src normalization."
    - "feature-006 and feature-001 reflect data-fe-uid; protocol-compat note updated."
    - "spec-compiled governance evidence updated."
  scope_files:
