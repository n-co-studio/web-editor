conventions:
  naming:
    - pattern: "REPO_OS_ prefix for override env vars"
      scope: "Hook scripts"
    - pattern: "log_override + log_hook_event for all override early-exits"
      scope: "Hook scripts"
    - pattern: "warn() for advisory messages, block() for blocking failures"
      scope: "pre-commit-gates.sh"
  patterns:
    - pattern: "REPO_OS_RECOVER early-exit: log_override, log_hook_event with recovery_bypass, stderr message, exit 0"
      rationale: "Consistent pattern across state-guard.sh, pre-commit-gates.sh, and now branch-guard.sh"
    - pattern: "Trailing slash on .claude/.state/ in glob/substring matches"
      rationale: "Prevents false matches on paths like .claude/.state-backup (matches mode-guard.sh pattern)"
    - pattern: "cleanup_session called in all exit paths that close the session (not just successful close)"
      rationale: "Prevents stale state files persisting into next session"
  decisions:
    - "0004"
    - "0012"
  boundaries:
    - module: ".claude/hooks/session-close-check.sh"
      owner_brief: "Hook Mechanical Fixes"
    - module: ".claude/hooks/pre-commit-gates.sh"
      owner_brief: "Hook Mechanical Fixes"
    - module: ".claude/hooks/branch-guard.sh"
      owner_brief: "Hook Mechanical Fixes"
    - module: ".claude/hooks/state-guard.sh"
      owner_brief: "Hook Mechanical Fixes"
    - module: "AI.md (REPO_OS_RECOVER description)"
      owner_brief: "Hook Mechanical Fixes"
    - module: "AI.md (remaining hooks summary updates)"
      owner_brief: "Documentation Updates"
    - module: "docs/ai/quality-gates.md"
      owner_brief: "Documentation Updates"

