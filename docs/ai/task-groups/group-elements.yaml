      scope: "All group-related types, functions, and diff fields"
    - pattern: "group.ts in editing/ directory"
      scope: "DOM mutation module — follows reorder.ts/insert.ts pattern"
  patterns:
    - pattern: "Discriminated union on HistoryEntry.type — add 'group' case to undo/redo/resetAll"
      rationale: "Existing pattern for css/removal/reorder/insertion history entries"
    - pattern: "DiffBuilder method per operation type — buildGroup() alongside build()/buildReorder()/buildInsert()"
      rationale: "Each operation type gets its own builder method returning VisualDiff with the relevant changes array"
    - pattern: "moveBefore with appendChild fallback for DOM reparenting"
      rationale: "Chrome 133+ moveBefore preserves state; appendChild is the safe fallback"
    - pattern: "Block-reason guard returns string|null — null means allowed"
      rationale: "Matches getReorderBlockReason pattern; UI shows reason string when non-null"
