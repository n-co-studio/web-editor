    rationale: "Brief 1 of 2 — spec-first authoring of a significant feature before build, mirroring the structural-auto-layout / stable-element-identity precedent. The page-inferred store must be unmistakably distinct from design tokens so B1-2 does not pollute diff/drift semantics."

