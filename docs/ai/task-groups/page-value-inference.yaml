conventions:
  naming:
    - pattern: "PageValueStore / InferredOption (NOT DesignToken); PropertyChange.fromPageInference: true; 'On this page' option group; 'Page Defaults' feature-003 UI state; source tier 5 'Page-inferred values'"
      scope: "page-value inference capture + editor consumption + feature-003 amendment"
  patterns:
    - pattern: "Spec-first ratification (mirror stable-element-identity / structural-auto-layout two-brief precedent): Brief 1 authors feature-011 + amends feature-003 in compiled specs; Brief 2 implements against it. Page-inferred values are a SEPARATE store and never enter the DesignToken registry or populate PropertyChange.toToken."
      rationale: "Page-inferred values are observed reality, not design intent; folding them into TokenStore corrupts the token/drift trust chain that Claude Code consumes."
    - pattern: "Bound page inference as a last-resort fallback tier: activates only when token sources 1-4 yield nothing (tokenStore empty); real tokens always win and drop page values when they arrive over WebSocket."
      rationale: "Resolves the token-first vs 'match the page' thesis tension flagged by PM — page inference is a fallback, not a peer of the design system."
  decisions:
    - "0014"
    - "0020"
    - "0035"
    - "0038"
  boundaries:
    - module: "compiled-spec/features"
      owner_brief: "Write page-value inference feature spec"
    - module: "chrome-extension/content/tokens"
      owner_brief: "Build page-value inference"
    - module: "chrome-extension/content/editing"
