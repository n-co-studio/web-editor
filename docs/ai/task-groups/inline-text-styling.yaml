session_decisions:
  - session: daemon-20260821-180218-31544
    decision: "Use fromHtml/toHtml additive-optional fields on TextChange; fromText/toText remain required"
    rationale: "Matches InsertChange.outerHTML precedent; no protocol version bump needed; graceful degradation for consumers that ignore new fields"
  - session: daemon-20260821-180218-31544
    decision: "Allowlist-only serialization: strong, em, u, s, br — zero attributes; no DOMPurify dependency"
    rationale: "Input is operator-driven; paste is forced to plain text; hand-rolled walker is sufficient and avoids new dependency"
  - session: daemon-20260821-180218-31544
    decision: "Range mechanism: extractContents() + fragment wrap + insertNode() — not surroundContents() or execCommand"
    rationale: "surroundContents() throws on partial containment; execCommand deprecated and emits b/i"
  - session: daemon-20260821-194935-31544
    decision: "inline-format.ts (pure formatting module) created instead of inline-toolbar.ts — toolbar lifecycle lives in text.ts"
    rationale: "Separates pure DOM logic (testable without shadow DOM) from session lifecycle; toolbar state is scoped to TextEditor"
  - session: daemon-20260821-194935-31544
    decision: "fromHtml condition: present when sanitizedOriginalHtml !== originalText (original had markup); toHtml: present when newHtml !== newText (result has markup)"
    rationale: "Matches spec precisely — additive-optional, each field independently present; avoids over-inclusion"
  - session: daemon-20260821-194935-31544
    decision: "ShadowRoot.querySelector('#id') used for style deduplication instead of non-standard getElementById"
    rationale: "ShadowRoot.getElementById does not exist in W3C DOM spec; querySelector is standard and available on ShadowRoot"

