session_decisions:
  - session: 148
    decision: "Tests use Node's built-in test runner with an esbuild-based bundler script — no new dev-dependencies"
    rationale: "Pragmatist flagged vitest as over-engineered for the four-case suite in a zero-test repo; lightweight node:test runner matches the existing esbuild build chain"
  - session: 148
    decision: "Heading annotation handles all four combinations of {breakpoint, breakpointValue} symmetrically"
    rationale: "Cohesion review caught that the original two-branch form silently dropped the token-only case; symmetric handling avoids surprising the receiving AI when only one of the fields is populated"
  - session: 149
    decision: "Two narrow resolver callbacks on DiffBuilder (RuleSourceResolver + CrossBreakpointSourcesResolver) instead of widening RuleSourceResolver into a compound return type"
    rationale: "Pragmatist (plan-gating) flagged the widened compound return as over-engineering — single-implementation interface. Two narrow resolvers preserve the existing contract additively and read cleaner at the callsites in index.ts"
  - session: 149
    decision: "Cross-breakpoint walk DORMANT_MEDIA_RULE_CEILING = 2000, separate from the existing RULE_COUNT_CEILING = 5000 on the active cascade path"
    rationale: "Walking dormant @media branches visits rules normally skipped by matchMedia, so total rule count is higher on Tailwind-style design systems. Brief specified 2000 as a starting estimate; instrumentation for tuning is deferred"
  - session: 149
    decision: "Viewport-bound media-query allow-list uses substring match on (width|height|aspect-ratio):"
    rationale: "Naturally excludes print, hover, pointer, prefers-*, forced-colors, and orientation per brief; whitelist approach matches the intent and is more robust than a hand-maintained denylist"
  - session: 149
    decision: "CSSContainerRule is explicitly skipped (deferred)"
    rationale: "Container queries cannot be evaluated by matchMedia; surfacing them as cross-breakpoint context without ancestor-size evaluation would be misleading. A follow-on brief should add containerQuery handling"
  - session: 149
    decision: "buildPageContext unit-stripping bug (em/rem tokens) deferred as KL-1 in known-issues.md"
    rationale: "Diff-review surfaced a real pre-existing bug in buildPageContext but the code is on main (commit dfd7a68) and out of this brief's scope. A correct fix requires unit-aware breakpoint resolution and warrants its own brief"

