intent:
  goal: >-
    Make the copy-prompt markdown carry breakpoint context (active breakpoint
    on element heading, per-property [@ mediaQuery] annotation when a rule
    diverges from the active breakpoint, and a blockquote instruction when
    any breakpoint metadata is present) so the receiving AI knows which
    viewport / media-query the edits target.
  verification:
    - Edit at viewport 1280 with a `lg` design token shows `— @ lg (1280px)` on the element heading
    - Edit at a viewport with no design token loaded shows no breakpoint annotation
    - Per-property `[@ <conditionText>]` appears only when source.mediaQuery differs from active breakpoint
    - Active-breakpoint rules emit no per-property annotation
    - Instruction blockquote appears only when at least one diff carries breakpoint or mediaQuery metadata
    - Raw-JSON HTML comment is byte-identical to pre-change output
  scope_files:
    - packages/chrome-extension/src/content/batching/prompt-serializer.ts
  spec_references:
    - docs/spec/compiled/v1/data-contracts.md
    - docs/spec/compiled/v1/features/feature-002-visual-property-editing.md
    - docs/spec/compiled/v1/features/feature-005-mcp-server-bridge.md

conventions:
  naming:
    - pattern: "formatSourceContext(source, activeBreakpointValue)"
      scope: "prompt-serializer.ts helper signature — Brief 2 reuses this name"
  patterns:
    - pattern: "Heading annotation uses em-dash + @ token (value) form"
      rationale: "Visual separation from selector + line-info; readable in copy-paste"
    - pattern: "Per-property annotation uses [@ ...] suffix (only when divergent)"
      rationale: "Bracketed marker is unambiguous; absence is the signal for active-breakpoint rules"
    - pattern: "Comparison normaliser strips whitespace and lowercases conditionText before comparing"
      rationale: "Heuristic chosen by brief; imperfect — Brief 1 includes test cases covering the divergence path"
  decisions: []
