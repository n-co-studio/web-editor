intent:
  goal: >-
    Capture viewport-bound non-active @media rules during inspection and
    propagate end-to-end (diff → MCP → copy-prompt) as additive
    `allBreakpointSources` on `PropertyChange`, so the receiving AI can
    reason about responsive rules at other breakpoints without switching
    viewports. Active-viewport behaviour of the existing inspection path is
    unchanged — new context is additive and opt-in at the inspection layer.
  verification:
    - getAllBreakpointRules returns viewport-bound inactive rules only (matchesCurrentViewport flag set per rule)
    - CrossBreakpointRuleSource extends RuleSource with matchesCurrentViewport
    - PropertyChange.allBreakpointSources is additive optional; existing callers unaffected
    - @media print, hover, prefers-*, orientation NOT returned; CSSContainerRule skipped
    - CORS-tainted sheet → accessLevel partial; ceiling hit → partial, no throw
    - Copy-prompt renders cross-breakpoint sub-bullet only when populated
    - MCP get_pending_visual_changes description appended (not rewritten)
    - feature-002 Edge Cases bullet updated per PM proposal
  scope_files:
    - packages/shared/src/diff.ts
    - packages/chrome-extension/src/content/inspection/css-rules.ts
    - packages/chrome-extension/src/shared/css-types.ts
    - packages/chrome-extension/src/content/batching/prompt-serializer.ts
    - packages/chrome-extension/src/content/batching/diff-builder.ts
    - packages/chrome-extension/src/content/index.ts
    - packages/mcp-server/src/server.ts
    - docs/spec/compiled/v1/features/feature-002-visual-property-editing.md
  spec_references:
