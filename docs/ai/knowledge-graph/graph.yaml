  - id: "file-test-gate-bypass"
    type: "file"
    path: ".claude/.automation/tests/test-gate-bypass.sh"
    description: "Adversarial suite: gate-bypass attacks (spoofed/misplaced GATE_RESULT, agent-type spoofing, emergency and stacked overrides, headless AskUserQuestion, phase advance without a verdict, stale cross-session state, EARLY dispatch-phase refusal). 13 cases. The early-dispatch case pins the security-relevant half of Decision t-0059: a critic verdict dispatched from build (before review) must be refused, since the commit gates check only that dispatch_phase is present, never its value. Repaired 2026-10-22 (R32): 13 forgery sites re-pointed to get_session_state_dir(); SIX chained setup walks were failing silently (set -e does not fire in the left operand of an && list) so every attack ran from init rather than review/build and was rejected for the wrong reason; the phase-advance case called _tap_pass in all three branches and could not fail; and tests 6/7 wrote `VAR=1 printf ... | bash hook`, binding the override to printf so it never reached the hook. Those two now pin the real boundary: REPO_OS_RECOVER=1 skips state-dependent gates by design (pre-commit-gates.sh:26, audited via log_override at :187) while A4 secret scanning still blocks, confirmed by a 2x2 control probe over secret/clean x override/no-override plus stacked overrides. NOTE: the earlier KG claim of '11/11 passing' was not evidence of discrimination — at that point the attacks were landing in the wrong phase. Under mutation (pre-commit-gates forced to exit 0) only a subset of cases goes red; the suite is not uniformly discriminating"
    last_verified: "2026-10-22"
    status: "active"
