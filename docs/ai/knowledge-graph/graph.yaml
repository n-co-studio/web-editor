    description: "Decision record: directional dispatch-phase acceptance for governance verdicts. A verdict carrying a terminal GATE_RESULT dispatched at or AFTER its expected phase is accepted, records a dispatch_phase_discrepancy line and logs phase_late_accepted; dispatched EARLIER it is still refused, as is a verdict with no sentinel. Position compared by index in get_phases_for_type, so an unresolvable phase fails closed. Motivated by 20 APPROVED verdicts destroyed over 2026-10-20/22, which stalled 5 briefs and lost 3 sessions' work. Exit: REPO_OS_STRICT_DISPATCH_PHASE=1"
    last_verified: "2026-10-22"
    status: "active"
