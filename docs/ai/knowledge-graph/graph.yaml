    description: "Operator CLI for the automation queue (t-0017): add, approve, remove, set-priority, show, review, recover-entry, reopen-wo, reopen-entry, reset-breaker, start-daemon, halt, force-halt, resume. Note the three transitions are disjoint and each covers exactly one source status: approve moves pending-review, recover-entry moves running, reopen-entry moves review, and reopens that entry's work order when no sibling still blocks it — without that the daemon defers the entry into blocked; for a task group with children still in review/blocked/failed it declines, says so in both output forms, and points at reopen-wo. reset-breaker is the sanctioned exit from a tripped circuit breaker — the counter persists on disk, a restart does not clear it, and the only other reset runs on a successful session the breaker is preventing. It derives REPO_ROOT from its OWN path (SCRIPT_DIR/../..), NOT from cwd — so running this file from another directory still operates on ITS repo's queue, and a test must copy it into a sandbox rather than invoke the real one."
