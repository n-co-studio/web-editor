    last_verified: "2026-08-07"
    status: "active"
    layer: "template"
  - id: "hook-permission-allowlist"
    type: "hook"
    path: ".claude/hooks/_permission-allowlist.sh"
    description: "Permission allowlist for tools and commands. _PERMISSION_DENY_BASH is checked BEFORE _PERMISSION_ALLOW_BASH in both callers (permission-request.sh, pretooluse-permission.sh); is_bash_allowed matches grep -qE \"^${pat}\" and appends no terminator, so patterns supply their own end anchor. 2026-10-22 (Decision t-0060) four end-anchored patterns permit EXECUTING repo-controlled verification scripts — bash under .claude/hooks/tests/, .claude/.automation/tests/, .claude/tools/ (one optional subdirectory level), plus bash -n on .claude/ paths. Previously bare `bash ` was absent from the allow list (never denied), so it fell through to the dialog and headless fail-closed made every \"all suites pass\" acceptance criterion unachievable. Path segments exclude '.', so the SCRIPT PATH cannot escape the directory; the $ anchor refuses same-line chains. Arguments are NOT path-bounded (arg class admits '.' and '/'), but metacharacters are excluded so an argument cannot start a new command. Known pre-existing gap shared by all prefix entries: grep matches per line, so multi-line commands are not covered. First test coverage of this file landed with t-0060. 2026-10-22: 'git cherry-pick' added to the Git write-operations block so branch recovery can replay commits headlessly — the task-details-header recovery brief escalated with headless_unknown_command without it, blocking two sibling briefs. CAVEAT worth knowing: a pick creates a commit WITHOUT passing the pre-commit gate chain, because pre-commit-gates.sh dispatches on command text containing the commit verb and a pick does not match it; git's own pre-commit hook does not fire either. Permitted on the precedent of the already-allowed 'git merge', which has the same gap, not on gate coverage. The prefix also admits -n/--no-commit and the --continue/--abort/--skip conflict flags, the latter deliberately"
    last_verified: "2026-10-22"
    status: "active"
    layer: "template"
  - id: "hook-cleanup-helper"
    type: "hook"
    path: ".claude/hooks/_cleanup-helper.sh"
    description: "Session cleanup (set -e-safe _delete_if_owned; cross-session marker cleanup outside per-session state-dir gate), branch sealing (record_closed_branch), and editor-live branch deletion/orphan-seal helpers"
