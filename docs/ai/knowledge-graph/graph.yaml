  - id: "decision-0060"
    type: "decision"
    path: "docs/ai/decisions/t-0060-bash-verification-execution.md"
    description: "Decision record: executing repo-controlled verification scripts headlessly. Four end-anchored _PERMISSION_ALLOW_BASH patterns permit bash under .claude/hooks/tests/, .claude/.automation/tests/ and .claude/tools/ (one optional subdirectory level), plus bash -n on .claude/ paths. Motivated by bare `bash ` being absent from the allow list while never denied: it fell through to the dialog, and headless fail-closed made every brief requiring \"all suites pass\" unachievable. For hooks/tests and .automation/tests this grants nothing new, because the pre-existing `source .claude/hooks/` and `source .claude/.automation/` entries are strict supersets (arbitrary repo script in the current shell, no subprocess boundary). For .claude/tools/ it IS new capability — there is no `source .claude/tools/` entry — justified instead by the already-allowed `node `/`python3 ` entries being unrestricted execution; it admits the writers kg-seed.sh and kg-merge-deltas.sh. Path segments exclude '.' so the SCRIPT PATH cannot escape; arguments are NOT path-bounded (the arg class admits '.' and '/'), though metacharacters are refused so an argument cannot start a new command. Executing a hook itself is refused. Depends on Write/Edit guards keeping those directories agent-unwritable. Known pre-existing gap stated rather than hidden: grep matches per line, so multi-line commands are uncovered and `bash <suite>` is a new qualifying first line; is_bash_denied also greps per line, so a deny-listed second line is still denied. Shipped the first test coverage of _permission-allowlist.sh in the repo (21 cases: 8 fail-first, 11 guard applied per-pattern, 2 ordering)"
    last_verified: "2026-10-22"
    status: "active"
    layer: "template"
  - id: "hook-layer3-hook-integration"
