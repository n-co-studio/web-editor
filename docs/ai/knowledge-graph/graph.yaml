    path: ".claude/hooks/tests/layer3-hook-integration.sh"
    description: "Layer 3 of the hook test suite: exercises every hook at the phase transitions where it fires, verifying allow/block/advance behaviour and inter-hook state chains. Requires jq (skips cleanly without it); bash 3.2 compatible. 311 cases as of 2026-10-22 (hermetic: unsets REPO_OS_SESSION_ID/CLAUDE_HEADLESS so a run from inside a headless session cannot inherit its identity), including the Decision t-0059 directional dispatch-phase section and the Decision t-0060 section — the latter being the first test coverage of _permission-allowlist.sh anywhere in the repo"
