    description: "Adversarial suite: state-corruption attacks (verdict forgery, truncated/foreign phase-state, safety-valve abuse, config injection, stale cross-session state, concurrent writes). 14 cases. Repaired 2026-10-22 (R32): ran 8 of 14 — it died at exit 127 because _parse_config_field lives in queue-manager.sh, which sandbox-setup.sh does not source. 20 forgery sites re-pointed to get_session_state_dir(), EXCEPT .session-baseline-sha which session-close-check.sh reads from $REPO_ROOT/.claude/ and not the state dir. The two safety-valve cases failed because a freshly-init'd interactive session takes the interactive-pause exit preceding the valve; they now set REPO_OS_SESSION_ID to model the worktree/headless session the valve applies to, and the A4 escalation is confirmed written. Concurrency case now pins a post-fork phase rather than merely asserting the phase is non-empty, which had passed while no concurrency occurred"
