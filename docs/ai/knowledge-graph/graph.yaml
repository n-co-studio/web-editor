    path: ".claude/.automation/tests/test-phase-ordering.sh"
    description: "Adversarial suite: phase-ordering attacks (forward jumps, direct state edits, session-type manipulation, double-init, concurrent writes). 14 cases, including an isolator for the non-adjacency ordering rule: init->plan is the one forward jump no substance gate guards, and under mutation it is the ONLY phase-ordering case that goes red when that rule is disabled (Decision t-0061 work). Repaired 2026-10-22 (R32): ran 0 of 13 because every case jumped init->plan while drift-check sits between and is not skippable (Decision 0038), aborting the suite under set -e. Now uses the shared _reach/_setup_at helper in sandbox-setup.sh; attacks still call bare advance_phase so nothing seeded for setup can make one pass for the wrong reason, and unreachable setup reports a visible failing case. Forgeries re-pointed from the retired flat state path to get_session_state_dir() (Decision 0030). TAP tally moved to a shared temp file because per-subshell counters never aggregated. The direct-phase-state-edit case was unfailable (_tap_pass in both branches) and is now a real assertion documenting the residual no-content-integrity risk. KNOWN WEAKNESS: the forward-jump cases are held by the independent substance gates, not by the non-adjacency ordering rule — disabling that rule alone leaves all 13 green, so they do not pin that layer"
