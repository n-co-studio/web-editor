  - id: "decision-0057"
    type: "decision"
    path: "docs/ai/decisions/t-0057-close-pipeline-controls.md"
    description: "The close is a pipeline with controls: a finished entry carries a recorded close_state and close_steps (one derivation site, for pre-v1.10.0 entries only), close_path resolves from solo_mode then pins on first transition, merge_hold is the one source of a hold and held is only its rendering (a view over a pending state — never over a finished state, and never over a refusing one, since the merge gate admits held), and the operator gets merge / hold-merge / set-close / close-status. queue-cli merge does not merge — it calls runner.sh --close-entry, so the solo close pipeline keeps exactly one implementation. The pr path adds a second pipeline over the same state field: lib/pr-manager.sh is the only gh surface, an entry opens a pull request at close (gated on push_on_complete AND task-group finality, not on close_path), the daemon re-reads every open one per loop, the branch is sealed at open and again at merge, and every unavailability degrades to ready without failing the entry. A conflict is the one close outcome that leaves the pipeline: it escalates to review and waits for `resolve-conflict <id> --agent|--ours|--theirs|--manual`. --agent writes a fix brief from the escalation and queues it as a follow-up (follow_up_of) on the same branch; --ours/--theirs STORE the operator's strategy in conflict_resolution rather than applying it, so the one `git rebase` in reverify-merge.sh consumes it (inverting to git's -X vocabulary, once, then clearing) and close-time re-verification still runs; --manual records the choice and re-arms nothing. Every mode that re-arms goes through queue_close_rearm, which moves the entry back to completed/ at close_state: ready, clears reverified and error_log, and appends a `resolve` close_step naming the mode and the note."
    last_verified: "2026-10-23"
    status: "unverified"
    layer: "template"
