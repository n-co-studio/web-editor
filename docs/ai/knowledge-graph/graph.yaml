  - id: "hook-state-writer"
    type: "hook"
    path: ".claude/hooks/state-writer.sh"
    description: "Captures governance state files at SubagentStop; calls refresh_manifest_entry after each write (2026-08-07); 2026-09-01 all three verdict-rejection paths (phase_mismatch, no_sentinel, combined_no_sentinel) write a verdict-rejected escalation via shared _write_verdict_rejection(), and phase-mismatch reporting names EXPECTED_PHASE. 2026-10-22 (Decision t-0059) phase_mismatch is DIRECTIONAL: a verdict dispatched at or after its expected phase is accepted, writes a dispatch_phase_discrepancy line into the verdict file and logs phase_late_accepted; dispatched EARLIER it is still refused, as is a verdict with no terminal sentinel. Position is compared by index in get_phases_for_type, so an unresolvable phase fails closed. REPO_OS_STRICT_DISPATCH_PHASE=1 restores exact matching. Parse contract per Decision t-0039 deliberately unchanged. 2026-10-24: verdict capture was DEAD from 2026-10-23 (14 captured on the 22nd, then zero, only `no_message` logged) because the handback is appended to the subagent's transcript AFTER this hook reads it — measured +0.8s, with the file already present so the -f guard passes and the extraction finds nothing; no rejection is written, so every pragmatist/QA/A5 gate in that window reported success while verifying nothing. The single read is now a bounded poll (~3s, 100ms steps, breaks on first hit — live recovery logged waited:0x100ms); only agent_transcript_path is polled, the parent is read once because it structurally never holds a handback. The no_message log now records each key's outcome, since key NAMES alone made four failures indistinguishable (key absent / value empty / file missing / handback not yet written). Note hook Layer 7 ('Criteria Verdict Capture') passed throughout, because its fixtures write the transcript BEFORE invoking the hook, so the race cannot occur in-fixture — a green suite was not evidence here"
    last_verified: "2026-10-22"
    status: "active"
    layer: "template"

