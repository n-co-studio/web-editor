    context: "REPO_OS_SESSION_ID is authoritative for worktree and daemon sessions, so get_session_id checks it BEFORE _CACHED_SESSION_ID and overrides the cache on divergence, clearing _CACHED_SESSION_STATE_DIR with it. The reverse order shipped from 2026-02-26 to 2026-10-19 and meant only the FIRST brief of a daemon run could complete: the daemon is one long-lived process re-exporting the variable per brief, so brief 1's id answered for all of them, plan-approved landed under the stale key and every later brief deadlocked in the plan phase. The cache is kept because it is what holds identity stable across a context-window turnover (3647acf); both directions are pinned by layer4 L4.11 and L4.15"
