name: Bug Report
description: Report a bug in NCO Studio Web Editor (extension, MCP server, or dev plugin)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below to help us reproduce and fix the issue quickly.
        For security issues, see [SECURITY.md](https://github.com/{owner}/{repo}/blob/main/SECURITY.md) — do not open a public issue.

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: "Found in chrome://extensions → NCO Studio Web Editor → Details. Example: 0.2.0"
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: "Found in chrome://version → Google Chrome. Example: 120.0.6099.130"
      placeholder: "120.0.6099.130"
    validations:
      required: true

  - type: input
    id: mcp-server-version
    attributes:
      label: MCP server version (@nco-studio/web-editor-mcp)
      description: "Run: npx @nco-studio/web-editor-mcp --version"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: dev-plugin-version
    attributes:
      label: Dev plugin version (@nco-studio/web-editor-plugin)
      description: "Run: npm ls @nco-studio/web-editor-plugin in your project"
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: affected-component
    attributes:
      label: Affected component
      options:
        - Chrome extension (overlay / selection / property panel)
        - Chrome extension (queue panel)
        - Chrome extension (toolbar icon / popup)
        - MCP server (connection / WebSocket)
        - MCP server (MCP tools / Claude Code integration)
        - Dev plugin (data-source-* attributes)
        - Protocol mismatch / version banner
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start the dev server with `npm run dev`
        2. Open http://localhost:5173 in Chrome with the extension enabled
        3. Click an element
        4. Observe that ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, console output, and screenshots if relevant.
    validations:
      required: true

  - type: textarea
    id: console-output
    attributes:
      label: Console output
      description: "Paste any errors from: (1) Chrome DevTools Console on your dev page, (2) chrome://extensions → NCO Studio Web Editor → service worker console."
      render: text
    validations:
      required: false

  - type: textarea
    id: mcp-server-output
    attributes:
      label: MCP server output
      description: Paste any error lines from the MCP server terminal output.
      render: text
    validations:
      required: false
