# Release workflow — STAGES @nco-studio/web-editor-mcp and
# @nco-studio/web-editor-plugin to npm via OIDC Trusted Publishing. No stored
# token, and nothing becomes public when this workflow finishes.
#
# Triggered by: push of a tag matching v* (e.g. v0.2.0)
#
# Pushing a tag does not release anything. Both packages land in npm's stage
# queue, and a maintainer promotes them with a 2FA challenge — on npmjs.com
# under Staged Packages, or `npm stage approve <stage-id>`. That is deliberate:
# OIDC removes the human from the release path, and staging puts one back.
#
# OPERATOR SETUP REQUIRED (one-time, before first use):
#   1. npmjs.com -> @nco-studio -> each package -> Settings -> Publishing access
#      -> add a trusted publisher
#   2. Set:
#        Repository:  n-co-studio/web-editor
#        Workflow:    release.yml
#        Environment: release
#   3. Allowed actions: leave BOTH boxes unchecked.
#        `npm stage publish` is always permitted and cannot be switched off.
#        The boxes only ADD direct `npm publish` and `npm dist-tag` on top, and
#        this workflow wants neither — unchecked is what makes it stage-only, so
#        a direct publish from CI is refused by the registry.
#   4. Create the `release` environment: repo Settings -> Environments -> New.
#      The job declares `environment: release`; without it the job fails before
#      reaching npm.
#   Repeat 1-3 for both packages.
#   A mismatch between these values and the workflow identity fails as a 404,
#   not as a permissions error. See RELEASING.md for the full walkthrough.
#
# This workflow is release-only -- it does NOT replace the test/lint CI pipeline.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # -- Verify ----------------------------------------------------------------
  verify:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (monorepo)
        run: npm run typecheck --workspaces --if-present

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Smoke test (tarball install)
        run: node scripts/smoke-test.mjs

      - name: Dry-run publish assertion
        run: node scripts/publish-dry-run.mjs

      # Upload built artifacts for the publish job.
      #
      # upload-artifact@v4 does NOT preserve full workspace-relative paths: it
      # roots the artifact at the LEAST COMMON ANCESTOR of the given paths.
      # Both paths below sit under packages/, so that becomes the artifact root
      # and it contains mcp-server/dist/ and dev-plugin/dist/ — the `packages/`
      # prefix is stripped. The download step has to put it back.
      #
      # This bit the first v0.2.1 run (38352070977): the comment here claimed
      # the opposite, download omitted `path:`, and publish died at
      # "ERROR: mcp-server/dist missing" without ever reaching npm.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            packages/mcp-server/dist/
            packages/dev-plugin/dist/
          retention-days: 1

  # -- Publish ---------------------------------------------------------------
  publish:
    name: Publish to npm (OIDC)
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11.x. Trusted publishing needs npm >= 11.5.1 and
      # `npm stage` needs >= 11.15.0, so the floor below is the stricter of the
      # two. The Node 20 this job pinned before (npm 10.x) could never have
      # authenticated over OIDC — it would have failed however the trusted
      # publisher was configured, with a 401 that reads as a misconfiguration
      # rather than a version problem.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Assert it rather than trust it, so a future change to the Node image
      # surfaces here as a clear message instead of a 401 at publish time.
      - name: Verify npm supports trusted publishing and staging
        run: |
          need=11.15.0
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "ERROR: npm $have is too old for staged publishing (need >= $need)"
            exit 1
          fi
          echo "npm $have OK (>= $need)"

      - name: Install dependencies
        run: npm ci

      # `path: packages` is load-bearing — see the upload step. The artifact is
      # rooted at packages/, so it must be unpacked there to land back at
      # packages/<pkg>/dist/. Without it the files arrive at the workspace root
      # and the verification step below fails.
      - name: Restore built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: packages

      - name: Verify dist artifacts exist
        run: |
          test -d packages/mcp-server/dist   || (echo "ERROR: mcp-server/dist missing" && exit 1)
          test -d packages/dev-plugin/dist    || (echo "ERROR: dev-plugin/dist missing"  && exit 1)

      # Provenance attestation requires a PUBLIC repository. Asking for it on a
      # private repo fails outright, so the flag is decided at run time: the
      # release still goes out either way, and provenance switches itself on
      # the moment the repository is made public — no edit needed.
      - name: Decide provenance flag
        id: prov
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Repository is private — staging WITHOUT provenance."
            echo "Make the repository public to get signed provenance statements."
          else
            echo "flag=--provenance" >> "$GITHUB_OUTPUT"
            echo "Repository is public — staging with provenance."
          fi

      # `npm stage publish`, not `npm publish`.
      #
      # The trusted publisher for these packages is configured stage-only: the
      # "Allowed actions" boxes for `npm publish` and `npm dist-tag` are left
      # unchecked, so the registry rejects a direct publish from this workflow.
      # Staging is always permitted and needs no 2FA, which is what lets a
      # non-interactive run do it at all.
      #
      # Nothing is public when this job finishes. Each package lands in the
      # stage queue and a maintainer promotes it with a 2FA challenge, so every
      # release keeps a human in the loop even though CI built it.
      - name: Stage @nco-studio/web-editor-mcp
        run: npm stage publish ${{ steps.prov.outputs.flag }} --access public
        working-directory: packages/mcp-server

      - name: Stage @nco-studio/web-editor-plugin
        run: npm stage publish ${{ steps.prov.outputs.flag }} --access public
        working-directory: packages/dev-plugin

      - name: How to release what was just staged
        run: |
          echo "Both packages are staged. Nothing is public yet."
          echo
          echo "Approve on npmjs.com under the package's Staged Packages tab,"
          echo "or from a trusted device:"
          echo
          echo "  npm stage list @nco-studio/web-editor-mcp"
          echo "  npm stage approve <stage-id>"
          echo "  npm stage list @nco-studio/web-editor-plugin"
          echo "  npm stage approve <stage-id>"
          echo
          echo "Approval prompts for 2FA either way. 'npm stage reject <stage-id>' discards one."
