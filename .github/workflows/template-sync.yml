# Reference: template-sync workflow using the custom sync engine.
#
# This file is a REFERENCE TEMPLATE — it is NOT directly used by any
# automation. Operators must copy this content to their child repo's
# .github/workflows/template-sync.yml manually (GITHUB_TOKEN cannot
# push workflow changes via template-sync).
#
# The sync engine replaces the PR-based actions-template-sync dependency
# with a direct-push model. It copies files from the template repo
# (respecting .templatesyncignore), merges .gitignore via section markers,
# runs decision cleanup (Decision 0022), and commits directly to main.
#
# Preconditions:
#   - Child repo must allow the GitHub Actions bot to push to main
#     (no branch protection requiring reviews or status checks)
#   - SOURCE_REPO_TOKEN secret must have read access to the template repo
#
# Decision 0015 — Solo mode (PR-free, direct commit to main)
# Decision 0022 — Template Decision Naming Convention

name: Template Sync

on:
  # Triggered by upstream template repo (via gh workflow run)
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source template repository (owner/name)'
        required: false
        default: ''

  # Optional: scheduled sync (uncomment and adjust as needed)
  # schedule:
  #   - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run template sync engine
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          # Configure git for commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Determine template repo URL
          # Priority: workflow input > hardcoded default
          TEMPLATE_REPO="${{ github.event.inputs.source_repo }}"
          if [ -z "$TEMPLATE_REPO" ]; then
            # Set your template repo here (owner/name format)
            TEMPLATE_REPO="markpreston2/repo-OS-template"
          fi

          # Build authenticated URL for private template repos
          TEMPLATE_URL="https://x-access-token:${SOURCE_REPO_TOKEN}@github.com/${TEMPLATE_REPO}.git"

          # Run the sync engine
          bash .claude/.automation/lib/template-sync-engine.sh "$TEMPLATE_URL" main
