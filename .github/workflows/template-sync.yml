name: Template Sync

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: OWNER/repo-OS-template # Replace with your template repo
          upstream_branch: main
          pr_title: "chore: sync with upstream template"
          pr_labels: template-sync
          # Required if the template repo is private. Create a classic PAT
          # with repo + read:org scopes and add it as a repository secret
          # named SOURCE_REPO_TOKEN. If the template repo is public, remove
          # this line — the default GITHUB_TOKEN works without extra setup.
          source_gh_token: ${{ secrets.SOURCE_REPO_TOKEN }}
          target_gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge sync PR
        run: |
          PR=$(gh pr list --label template-sync --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr merge "$PR" --merge --delete-branch
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
