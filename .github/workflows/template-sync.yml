name: Template Sync

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly on Monday at 04:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: AndreasAugustin/actions-template-sync@v6
        with:
          source_repo_path: markpreston2/repo-OS-template
          upstream_branch: main
          pr_title: "chore: sync with upstream template"
          pr_labels: template-sync

      - name: Auto-merge sync PR
        run: |
          PR=$(gh pr list --label template-sync --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr merge "$PR" --merge --delete-branch
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
